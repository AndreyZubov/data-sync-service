services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The service itself is opt-in (`make compose-app`), so the default
  # `make compose-up` still starts only Postgres for `make run`.
  syncd:
    profiles: [app]
    build:
      context: .
    env_file:
      - path: .env
        required: false
    # Overrides .env, whose DSN points at localhost rather than the postgres service.
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://sync:sync@postgres:5432/sync?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
