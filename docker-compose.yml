services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The service itself is opt-in (`make compose-app`), so the default
  # `make compose-up` still starts only Postgres for `make run`.
  syncd:
    profiles: [app]
    build:
      context: .
    env_file:
      - path: .env
        required: false
    # Overrides .env, whose DSN points at localhost rather than the postgres service.
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://sync:sync@postgres:5432/sync?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Prometheus and Grafana with the bundled alert rules and dashboard, opt-in
  # with the service (`make compose-observability`).
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      # Local use only: anyone reaching the port can view the dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/data-sync-service.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
