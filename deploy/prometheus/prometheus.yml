# Scrapes the service started by `make compose-observability`. For another
# deployment, point the target at the service's HTTP_ADDR and load alerts.yml
# into that Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: syncd
    static_configs:
      - targets: ["syncd:8080"]
