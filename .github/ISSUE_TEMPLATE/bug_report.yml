name: Bug report
description: Something behaves differently from what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include real Salesforce credentials, org IDs, or customer records.
        Redact them before pasting logs or configuration.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set SYNC_OBJECTS=...
        2. make run
        3. curl localhost:8080/...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` field logged at startup, or the commit SHA.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Secrets removed.
      render: shell
